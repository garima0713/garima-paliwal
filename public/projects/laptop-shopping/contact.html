<!-- HEADER -->

<header>

<div class="logo">

<h2>💻 Laptop Store</h2>

</div>

<div class="search-box">

type="text"
placeholder="Search Laptop...">

</div>

<nav>

</header>


<!-- CONTACT -->

<section class="contact-container">

<h2>

Contact Us

</h2>

<form id="contactForm">

<input
type="text"
placeholder="Your Name"
required>

<input
type="email"
placeholder="Your Email"
required>

<input
type="text"
placeholder="Subject"
required>

<textarea
rows="6"
placeholder="Write your message..."
required>

</textarea>

<button
type="submit"
class="buy-btn">

Send Message

</button>

</form>

</section>


<footer>

<p>

© 2026 Laptop Store | All Rights Reserved.

</p>

</footer>


<script src="products.js"></script>

<script src="script.js"></script>

<script>

document
.getElementById("contactForm")
.addEventListener("submit",function(e){

    e.preventDefault();

    alert("✅ Message Sent Successfully!");

    this.reset();

});

</script>

</body>
