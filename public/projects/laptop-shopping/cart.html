<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Shopping Cart | Laptop Store</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="responsive.css">

</head>

<body>

<!-- ==========================
HEADER
========================== -->

<header>

<div class="logo">

<h2>💻 Laptop Store</h2>

</div>

<div class="search-box">

<input
type="text"
placeholder="Search Laptop...">

</div>

<nav>

<a href="index.html">

🏠 Home

</a>

<a href="wishlist.html">

❤️ Wishlist

<span id="wishlist-count">

0

</span>

</a>

<a href="login.html">

👤 Login

</a>

<a href="contact.html">

📞 Contact

</a>

<a href="cart.html">

🛒 Cart

<span id="cart-count">

0

</span>

</a>

</nav>

</header>


<!-- ==========================
CART
========================== -->

<section class="cart-container">

<h2>

My Shopping Cart

</h2>

<div id="cart-items">

<!-- JS Products -->

</div>


<div class="cart-summary">

<h2>

Order Summary

</h2>

<div class="total-row">

<span>

Total Amount

</span>

<strong id="total-price">

₹0

</strong>

</div>

<button
class="confirm-btn"
onclick="confirmOrder()">

Confirm Order

</button>

</div>

</section>


<!-- ==========================
SUCCESS POPUP
========================== -->

<div
class="success-popup"
id="success-popup">

<div class="success-box">

<div class="tick">

✓

</div>

<h2>

Order Placed Successfully

</h2>

<p>

Thank you for shopping with us.

</p>

<p>

Order ID :

<b id="order-number">

LS000000

</b>

</p>

<p>

Redirecting...

</p>

<button
class="buy-btn"
onclick="closeSuccess()">

Continue Shopping

</button>

</div>

</div>
<!-- ==========================
FOOTER
========================== -->

<footer>

<p>

© 2026 Laptop Store | All Rights Reserved.

</p>

</footer>


<!-- ==========================
JAVASCRIPT
========================== -->

<script src="products.js"></script>

<script src="script.js"></script>

</body>

</html>
