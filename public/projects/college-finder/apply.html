<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Apply Now | CollegeFinder India</title>

<link rel="stylesheet" href="style.css">

<style>

/* =====================================================
   APPLY PAGE ONLY
===================================================== */

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  background:linear-gradient(135deg,#dbeafe,#eff6ff);
  color:#0f172a;
  font-family:Arial, sans-serif;
}


/* =====================================================
   NAVBAR
===================================================== */

nav{
  width:100%;
  min-height:65px;
  padding:12px 5%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:rgba(255,255,255,0.90);
  border-bottom:1px solid #e5e7eb;
  position:sticky;
  top:0;
  z-index:1000;
}

.logo{
  font-size:24px;
  font-weight:800;
  color:#2563eb;
}

.navBtns{
  display:flex;
  gap:10px;
  align-items:center;
}

.homeBtn{
  padding:10px 16px;
  border:none;
  border-radius:10px;
  background:#2563eb;
  color:white;
  font-size:14px;
  font-weight:600;
  cursor:pointer;
  transition:0.3s;
}

.homeBtn:hover{
  transform:translateY(-2px);
}

#darkBtn{
  min-width:45px;
  padding:10px 12px;
}


/* =====================================================
   MAIN
===================================================== */

.container{
  min-height:calc(100vh - 65px);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:25px 15px;
}


/* =====================================================
   A4 SIZE CARD
===================================================== */

.card{
  width:100%;
  max-width:650px;

  min-height:700px;

  padding:28px 35px;

  background:white;

  border-radius:16px;

  border:1px solid #e5e7eb;

  box-shadow:0 15px 40px rgba(0,0,0,0.12);

  animation:fadeUp 0.5s ease;
}

@keyframes fadeUp{

  from{
    opacity:0;
    transform:translateY(20px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }

}


/* =====================================================
   COLLEGE INFO
===================================================== */

.college-selected{
  margin-bottom:20px;
  padding:12px 15px;

  background:#eff6ff;

  border-left:4px solid #2563eb;

  border-radius:8px;
}

.college-selected h3{
  margin:0 0 4px;
  color:#1d4ed8;
  font-size:16px;
}

.college-selected p{
  margin:0;
  color:#475569;
  font-size:13px;
}


/* =====================================================
   IMAGE
===================================================== */

.topImage{
  width:100%;
  height:150px;

  object-fit:cover;

  border-radius:12px;

  margin-bottom:18px;

  display:block;
}


/* =====================================================
   HEADING
===================================================== */

h2{
  text-align:center;

  font-size:30px;

  margin:0 0 5px;

  color:#0f172a;
}

.subtitle{
  text-align:center;

  color:#64748b;

  margin:0 0 22px;

  font-size:13px;
}


/* =====================================================
   FORM
===================================================== */

.formGroup{
  margin-bottom:12px;
}

.formLabel{
  display:block;

  margin-bottom:5px;

  font-size:13px;

  font-weight:600;

  color:#334155;
}

.formInput{
  width:100%;

  padding:11px 13px;

  border:1px solid #d1d5db;

  border-radius:9px;

  background:white;

  color:#111827;

  outline:none;

  font-size:14px;

  transition:0.2s;
}

.formInput:focus{
  border-color:#2563eb;

  box-shadow:
  0 0 0 3px
  rgba(37,99,235,0.10);
}

.error{
  display:block;

  min-height:15px;

  margin-top:3px;

  color:#ef4444;

  font-size:11px;
}


/* =====================================================
   BUTTON
===================================================== */

.applyBtn{
  width:100%;

  padding:13px;

  margin-top:7px;

  border:none;

  border-radius:10px;

  background:
  linear-gradient(
    135deg,
    #2563eb,
    #1d4ed8
  );

  color:white;

  font-size:15px;

  font-weight:700;

  cursor:pointer;

  transition:0.3s;
}

.applyBtn:hover{
  transform:translateY(-2px);

  box-shadow:
  0 8px 20px
  rgba(37,99,235,0.25);
}


/* =====================================================
   SUCCESS MESSAGE
===================================================== */

.success-message{
  display:none;

  margin-top:15px;

  padding:12px;

  text-align:center;

  border-radius:9px;

  background:#dcfce7;

  color:#166534;

  font-size:13px;

  font-weight:600;
}


/* =====================================================
   DARK MODE
===================================================== */

body.dark{
  background:
  linear-gradient(
    135deg,
    #020617,
    #0f172a
  );

  color:#f8fafc;
}

body.dark nav{
  background:rgba(15,23,42,0.95);

  border-color:#374151;
}

body.dark .logo{
  color:#60a5fa;
}

body.dark .card{
  background:#111827;

  border-color:#374151;

  box-shadow:
  0 15px 40px rgba(0,0,0,0.45);
}

body.dark h2{
  color:#f8fafc;
}

body.dark .subtitle{
  color:#cbd5e1;
}

body.dark .formLabel{
  color:#f1f5f9;
}

body.dark .formInput{
  background:#1f2937;

  color:#f8fafc;

  border-color:#475569;
}

body.dark .formInput::placeholder{
  color:#94a3b8;
}

body.dark .college-selected{
  background:#172554;

  border-color:#60a5fa;
}

body.dark .college-selected h3{
  color:#93c5fd;
}

body.dark .college-selected p{
  color:#cbd5e1;
}

body.dark .success-message{
  background:#052e16;

  color:#86efac;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

  nav{
    padding:10px 4%;
  }

  .logo{
    font-size:19px;
  }

  .homeBtn{
    padding:9px 11px;
    font-size:12px;
  }

  .container{
    padding:18px 10px;
    align-items:flex-start;
  }

  .card{
    min-height:auto;

    padding:22px 18px;

    border-radius:14px;
  }

  .topImage{
    height:130px;
  }

  h2{
    font-size:25px;
  }

}


/* =====================================================
   SMALL MOBILE
===================================================== */

@media(max-width:420px){

  .logo{
    font-size:17px;
  }

  .navBtns{
    gap:5px;
  }

  .homeBtn{
    padding:8px 9px;
  }

  #darkBtn{
    min-width:38px;
  }

  .card{
    padding:18px 14px;
  }

}

</style>

</head>


<body>


<!-- =====================================================
     NAVBAR
===================================================== -->

<nav>

  <div class="logo">
    CollegeFinder India
  </div>

  <div class="navBtns">

    <button
      type="button"
      id="darkBtn"
      class="homeBtn"
    >
      🌙
    </button>

    <button
      type="button"
      class="homeBtn"
      onclick="goHome()"
    >
      🏠 Home
    </button>

  </div>

</nav>


<!-- =====================================================
     MAIN
===================================================== -->

<section class="container">

  <div class="card">


    <!-- SELECTED COLLEGE -->

    <div
      class="college-selected"
      id="collegeInfo"
    >

      <h3 id="selectedCollegeName">
        College Application
      </h3>

      <p id="selectedCollegePlace">
        Please select a college first.
      </p>

    </div>


    <!-- IMAGE -->

    <img
      src="https://images.pexels.com/photos/6147369/pexels-photo-6147369.jpeg"
      class="topImage"
      alt="College Application"
    >


    <!-- HEADING -->

    <h2>
      Apply Now
    </h2>

    <p class="subtitle">
      Start your college journey today 🚀
    </p>


    <!-- NAME -->

    <div class="formGroup">

      <label
        class="formLabel"
        for="name"
      >
        Full Name
      </label>

      <input
        type="text"
        id="name"
        class="formInput"
        placeholder="Enter Your Full Name"
        autocomplete="name"
      >

      <span
        id="nameError"
        class="error"
      ></span>

    </div>


    <!-- EMAIL -->

    <div class="formGroup">

      <label
        class="formLabel"
        for="email"
      >
        Email Address
      </label>

      <input
        type="email"
        id="email"
        class="formInput"
        placeholder="Enter Your Email"
        autocomplete="email"
      >

      <span
        id="emailError"
        class="error"
      ></span>

    </div>


    <!-- MOBILE -->

    <div class="formGroup">

      <label
        class="formLabel"
        for="mobile"
      >
        Mobile Number
      </label>

      <input
        type="tel"
        id="mobile"
        class="formInput"
        placeholder="Enter Mobile Number"
        maxlength="10"
        inputmode="numeric"
        autocomplete="tel"
      >

      <span
        id="mobileError"
        class="error"
      ></span>

    </div>


    <!-- COURSE -->

    <div class="formGroup">

      <label
        class="formLabel"
        for="course"
      >
        Select Course
      </label>

      <select
        id="course"
        class="formInput"
      >

        <option value="">
          Choose Course
        </option>

        <option value="B.Tech / Engineering">
          B.Tech / Engineering
        </option>

        <option value="MBA">
          MBA
        </option>

        <option value="MBBS / Medical">
          MBBS / Medical
        </option>

        <option value="Law">
          Law
        </option>

        <option value="BCA">
          BCA
        </option>

        <option value="BBA">
          BBA
        </option>

        <option value="Pharmacy">
          Pharmacy
        </option>

        <option value="Architecture">
          Architecture
        </option>

        <option value="Polytechnic">
          Polytechnic
        </option>

      </select>

      <span
        id="courseError"
        class="error"
      ></span>

    </div>


    <!-- SUBMIT -->

    <button
      type="button"
      id="applyBtn"
      class="applyBtn"
      onclick="submitForm()"
    >
      📝 Submit Application
    </button>


    <!-- SUCCESS -->

    <div
      id="successMessage"
      class="success-message"
    >
      🎉 Application Submitted Successfully!
    </div>

  </div>

</section>


<script>

/* =====================================================
   HOME
===================================================== */

function goHome(){

  window.location.href="index.html";

}


/* =====================================================
   DARK MODE
===================================================== */

const darkBtn =
  document.getElementById("darkBtn");


function applyDarkMode(){

  if(
    localStorage.getItem("darkMode")
    === "on"
  ){

    document.body.classList.add("dark");

    darkBtn.textContent="☀️";

  }

  else{

    document.body.classList.remove("dark");

    darkBtn.textContent="🌙";

  }

}


applyDarkMode();


darkBtn.addEventListener(
  "click",
  function(){

    const isDark =
      document.body.classList.toggle("dark");

    if(isDark){

      localStorage.setItem(
        "darkMode",
        "on"
      );

      darkBtn.textContent="☀️";

    }

    else{

      localStorage.setItem(
        "darkMode",
        "off"
      );

      darkBtn.textContent="🌙";

    }

  }
);


/* =====================================================
   SELECTED COLLEGE
===================================================== */

let selectedCollege = null;

try{

  selectedCollege =
    JSON.parse(
      localStorage.getItem(
        "selectedCollege"
      )
    );

}
catch(error){

  selectedCollege=null;

}


/* SHOW SELECTED COLLEGE */

if(selectedCollege){

  document.getElementById(
    "selectedCollegeName"
  ).textContent =
    selectedCollege.name ||
    "Selected College";


  document.getElementById(
    "selectedCollegePlace"
  ).textContent =
    selectedCollege.place ||
    "College Details";

}


/* =====================================================
   CURRENT USER
===================================================== */

let currentUser = null;

try{

  currentUser =
    JSON.parse(
      localStorage.getItem(
        "currentUser"
      )
    );

}
catch(error){

  currentUser=null;

}


/*
   Agar currentUser nahi hai,
   old "user" storage ko bhi support karega.
*/

if(!currentUser){

  try{

    currentUser =
      JSON.parse(
        localStorage.getItem("user")
      );

  }
  catch(error){

    currentUser=null;

  }

}


/* AUTO FILL USER DATA */

if(currentUser){

  document.getElementById("name").value =
    currentUser.name || "";

  document.getElementById("email").value =
    currentUser.email || "";

  document.getElementById("mobile").value =
    currentUser.mobile || "";

  if(currentUser.course){

    const course =
      document.getElementById("course");

    const exists =
      [...course.options]
      .some(
        option =>
        option.value === currentUser.course
      );

    if(exists){

      course.value =
        currentUser.course;

    }

  }

}


/* =====================================================
   SUBMIT APPLICATION
===================================================== */

function submitForm(){


  /* GET VALUES */

  const name =
    document.getElementById("name")
    .value
    .trim();


  const email =
    document.getElementById("email")
    .value
    .trim();


  const mobile =
    document.getElementById("mobile")
    .value
    .trim();


  const course =
    document.getElementById("course")
    .value;


  /* ERRORS */

  const nameError =
    document.getElementById("nameError");

  const emailError =
    document.getElementById("emailError");

  const mobileError =
    document.getElementById("mobileError");

  const courseError =
    document.getElementById("courseError");


  nameError.textContent="";
  emailError.textContent="";
  mobileError.textContent="";
  courseError.textContent="";


  let valid=true;


  /* NAME */

  if(name===""){

    nameError.textContent=
      "Please enter your name";

    valid=false;

  }


  /* EMAIL */

  const emailPattern =
    /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


  if(email===""){

    emailError.textContent=
      "Please enter your email";

    valid=false;

  }

  else if(
    !emailPattern.test(email)
  ){

    emailError.textContent=
      "Please enter a valid email";

    valid=false;

  }


  /* MOBILE */

  const mobilePattern =
    /^[0-9]{10}$/;


  if(mobile===""){

    mobileError.textContent=
      "Please enter mobile number";

    valid=false;

  }

  else if(
    !mobilePattern.test(mobile)
  ){

    mobileError.textContent=
      "Mobile number must be 10 digits";

    valid=false;

  }


  /* COURSE */

  if(course===""){

    courseError.textContent=
      "Please select course";

    valid=false;

  }


  if(!valid){

    return;

  }


  /* =================================================
     APPLICATIONS ARRAY
  ================================================= */

  let applications=[];

  try{

    applications =
      JSON.parse(
        localStorage.getItem(
          "applications"
        )
      ) || [];

  }
  catch(error){

    applications=[];

  }


  /* =================================================
     APPLIED COLLEGES
  ================================================= */

  let appliedColleges=[];

  try{

    appliedColleges =
      JSON.parse(
        localStorage.getItem(
          "appliedColleges"
        )
      ) || [];

  }
  catch(error){

    appliedColleges=[];

  }


  /* =================================================
     COLLEGE NAME
  ================================================= */

  const collegeName =
    selectedCollege &&
    selectedCollege.name
      ? selectedCollege.name
      : "College not selected";


  /* =================================================
     CHECK DUPLICATE
  ================================================= */

  const alreadyApplied =
    applications.some(
      function(application){

        return (
          application.email === email &&
          application.college === collegeName
        );

      }
    );


  if(alreadyApplied){

    alert(
      "⚠️ You have already applied to this college."
    );

    return;

  }


  /* =================================================
     APPLICATION OBJECT
  ================================================= */

  const application={

    id:
      Date.now(),

    name:
      name,

    email:
      email,

    mobile:
      mobile,

    course:
      course,

    college:
      collegeName,

    collegePlace:
      selectedCollege
        ? selectedCollege.place || ""
        : "",

    collegeImage:
      selectedCollege
        ? selectedCollege.image || ""
        : "",

    date:
      new Date().toLocaleString(),

    status:
      "Submitted"

  };


  /* =================================================
     SAVE APPLICATION
  ================================================= */

  applications.push(
    application
  );


  localStorage.setItem(
    "applications",
    JSON.stringify(
      applications
    )
  );


  /* =================================================
     SAVE COLLEGE FOR PROFILE
  ================================================= */

  if(
    selectedCollege &&
    selectedCollege.name
  ){

    if(
      !appliedColleges.includes(
        selectedCollege.name
      )
    ){

      appliedColleges.push(
        selectedCollege.name
      );

    }

  }


  localStorage.setItem(
    "appliedColleges",
    JSON.stringify(
      appliedColleges
    )
  );


  /* =================================================
     SAVE CURRENT USER
  ================================================= */

  if(currentUser){

    currentUser.name =
      name;

    currentUser.email =
      email;

    currentUser.mobile =
      mobile;

    currentUser.course =
      course;


    localStorage.setItem(
      "currentUser",
      JSON.stringify(
        currentUser
      )
    );

  }


  /* =================================================
     SUCCESS
  ================================================= */

  document.getElementById(
    "successMessage"
  ).style.display="block";


  document.getElementById(
    "applyBtn"
  ).textContent=
    "✅ Application Submitted";


  document.getElementById(
    "applyBtn"
  ).disabled=true;


  alert(
    "🎉 Application Submitted Successfully!"
  );


  /*
     Profile page open karne ke liye
     thoda delay.
  */

  setTimeout(
    function(){

      window.location.href=
        "profile.html";

    },
    700
  );

}

</script>

</body>
</html>
