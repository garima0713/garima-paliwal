<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | CollegeFinder India</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ================= MENU BUTTON ================= -->
<button id="menuBtn" class="menuBtn">☰</button>


<!-- ================= SIDEBAR ================= -->
<div class="sidebar" id="sidebar">

  <h2>CollegeFinder</h2>

  <a href="dashboard.html">🏠 Dashboard</a>
  <a href="profile.html">👤 Profile</a>
  <a href="colleges.html">🎓 Colleges</a>
  <a href="favorites.html">❤️ Favorites</a>
  <a href="compare.html">⚖ Compare</a>
  <a href="apply.html">📝 Apply</a>
  <a href="about.html">ℹ About</a>
  <a href="contact.html">📞 Contact</a>

  <a href="login.html" onclick="logoutUser()">🚪 Logout</a>

</div>


<!-- ================= NAVBAR ================= -->
<nav>

  <div class="logo">
    CollegeFinder India
  </div>

  <div class="nav-buttons">

    <button onclick="window.location.href='index.html'">
      🏠 Home
    </button>

    <button onclick="window.location.href='colleges.html'">
      🎓 Colleges
    </button>

    <button id="darkBtn">
      🌙 Dark Mode
    </button>

  </div>

</nav>


<!-- ================= LOGIN ================= -->
<section class="login-section">

  <div class="login-card">

    <div class="login-header">

      <h2>Welcome Back 👋</h2>

      <p>
        Login to access your student account
      </p>

    </div>


    <!-- EMAIL -->
    <div class="input-group">

      <label for="email">
        Email
      </label>

      <input
        type="email"
        id="email"
        placeholder="Enter your registered email"
        autocomplete="email"
      >

      <small id="emailError"></small>

    </div>


    <!-- PASSWORD -->
    <div class="input-group">

      <label for="password">
        Password
      </label>

      <div class="password-box">

        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          autocomplete="current-password"
        >

        <span
          onclick="togglePassword()"
          class="eye"
        >
          👁️
        </span>

      </div>

      <small id="passwordError"></small>

    </div>


    <!-- LOGIN BUTTON -->
    <button
      class="loginBtn"
      onclick="loginUser()"
    >
      Login
    </button>


    <!-- MESSAGE -->
    <p id="successMsg"></p>


    <!-- REGISTER -->
    <p style="margin-top:15px;">

      New user?

      <a
        href="register.html"
        style="color:#007bff;font-weight:bold;"
      >
        Create Account
      </a>

    </p>

  </div>

</section>


<script>

/* =====================================================
   ALREADY LOGGED IN
===================================================== */

if (localStorage.getItem("isLoggedIn") === "true") {

  window.location.href = "dashboard.html";

}


/* =====================================================
   SHOW / HIDE PASSWORD
===================================================== */

function togglePassword() {

  const password =
    document.getElementById("password");

  password.type =
    password.type === "password"
      ? "text"
      : "password";

}


/* =====================================================
   LOGIN USER
===================================================== */

function loginUser() {

  const emailInput =
    document.getElementById("email");

  const passwordInput =
    document.getElementById("password");

  const emailError =
    document.getElementById("emailError");

  const passwordError =
    document.getElementById("passwordError");

  const msg =
    document.getElementById("successMsg");


  /* GET VALUES */

  const email =
    emailInput.value.trim().toLowerCase();

  const password =
    passwordInput.value;


  /* CLEAR OLD MESSAGES */

  emailError.innerHTML = "";
  passwordError.innerHTML = "";
  msg.innerHTML = "";


  /* =================================================
     VALIDATION
  ================================================= */

  if (email === "") {

    emailError.innerHTML =
      "❌ Please enter your email.";

    emailError.style.color = "red";

    return;

  }


  if (password === "") {

    passwordError.innerHTML =
      "❌ Please enter your password.";

    passwordError.style.color = "red";

    return;

  }


  /* =================================================
     GET REGISTERED USERS
  ================================================= */

  let users =
    JSON.parse(
      localStorage.getItem("users")
    ) || [];


  /* =================================================
     FIND USER BY EMAIL
  ================================================= */

  const user =
    users.find(
      u =>
        String(u.email)
          .trim()
          .toLowerCase() === email
    );


  /* =================================================
     USER NOT FOUND
  ================================================= */

  if (!user) {

    msg.innerHTML =
      "❌ Account not found.";

    msg.style.color = "red";

    return;

  }


  /* =================================================
     PASSWORD CHECK
  ================================================= */

  if (user.password !== password) {

    passwordError.innerHTML =
      "❌ Incorrect password.";

    passwordError.style.color = "red";

    return;

  }


  /* =================================================
     LOGIN SUCCESS
  ================================================= */

  localStorage.setItem(
    "currentUser",
    JSON.stringify(user)
  );


  localStorage.setItem(
    "isLoggedIn",
    "true"
  );


  msg.innerHTML =
    "✅ Login Successful!";

  msg.style.color = "green";


  /* =================================================
     OPEN DASHBOARD
  ================================================= */

  setTimeout(() => {

    window.location.href =
      "dashboard.html";

  }, 1000);

}


/* =====================================================
   LOGOUT
===================================================== */

function logoutUser() {

  localStorage.removeItem("isLoggedIn");

  localStorage.removeItem("currentUser");

}


/* =====================================================
   DARK MODE
===================================================== */

const darkBtn =
  document.getElementById("darkBtn");


if (
  localStorage.getItem("darkMode") === "on"
) {

  document.body.classList.add("dark");

}


darkBtn.addEventListener(
  "click",
  () => {

    document.body.classList.toggle("dark");


    localStorage.setItem(
      "darkMode",

      document.body.classList.contains("dark")
        ? "on"
        : "off"
    );

  }
);


/* =====================================================
   SIDEBAR
===================================================== */

const menuBtn =
  document.getElementById("menuBtn");

const sidebar =
  document.getElementById("sidebar");


menuBtn.addEventListener(
  "click",
  () => {

    sidebar.classList.toggle("active");

  }
);

</script>

</body>
</html>
