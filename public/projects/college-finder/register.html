<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Register | CollegeFinder India</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ================= MENU BUTTON ================= -->
<button id="menuBtn" class="menuBtn">☰</button>


<!-- ================= SIDEBAR ================= -->
<div class="sidebar" id="sidebar">

  <h2>CollegeFinder</h2>

  <a href="dashboard.html">🏠 Dashboard</a>
  <a href="profile.html">👤 Profile</a>
  <a href="colleges.html">🎓 Colleges</a>
  <a href="favorites.html">❤️ Favorites</a>
  <a href="compare.html">⚖ Compare</a>
  <a href="apply.html">📝 Apply</a>
  <a href="about.html">ℹ About</a>
  <a href="contact.html">📞 Contact</a>
  <a href="login.html">🔐 Login</a>

</div>


<!-- ================= NAVBAR ================= -->
<nav>

  <div class="logo">
    CollegeFinder India
  </div>

  <div class="nav-buttons">

    <button onclick="window.location.href='index.html'">
      🏠 Home
    </button>

    <button onclick="window.location.href='login.html'">
      🔐 Login
    </button>

    <button id="darkBtn">
      🌙 Dark Mode
    </button>

  </div>

</nav>


<!-- ================= REGISTER ================= -->
<section class="login-section">

  <div class="login-card">

    <h2>Create Account 🚀</h2>

    <p class="subtitle">
      Register to start your journey
    </p>


    <!-- FULL NAME -->
    <div class="input-group">

      <label for="name">Full Name</label>

      <input
        type="text"
        id="name"
        placeholder="Enter full name"
      >

    </div>


    <!-- FATHER NAME -->
    <div class="input-group">

      <label for="father">Father Name</label>

      <input
        type="text"
        id="father"
        placeholder="Father name"
      >

    </div>


    <!-- EMAIL -->
    <div class="input-group">

      <label for="email">Email</label>

      <input
        type="email"
        id="email"
        placeholder="Enter email"
        autocomplete="email"
      >

      <small id="emailError"></small>

    </div>


    <!-- MOBILE -->
    <div class="input-group">

      <label for="mobile">Mobile</label>

      <input
        type="tel"
        id="mobile"
        placeholder="Mobile number"
      >

    </div>


    <!-- ADDRESS -->
    <div class="input-group">

      <label for="address">Address</label>

      <input
        type="text"
        id="address"
        placeholder="Address"
      >

    </div>


    <!-- COURSE -->
    <div class="input-group">

      <label for="course">Course</label>

      <select id="course">

        <option value="Graduation">
          Graduation
        </option>

        <option value="Post Graduation">
          Post Graduation
        </option>

      </select>

    </div>


    <!-- 10TH -->
    <div class="input-group">

      <label for="tenth">10th %</label>

      <input
        type="number"
        id="tenth"
        placeholder="10th percentage"
        min="0"
        max="100"
      >

    </div>


    <!-- 12TH -->
    <div class="input-group">

      <label for="twelfth">12th %</label>

      <input
        type="number"
        id="twelfth"
        placeholder="12th percentage"
        min="0"
        max="100"
      >

    </div>


    <!-- ENTRANCE EXAM -->
    <div class="input-group">

      <label for="exam">
        Entrance Exam
      </label>

      <input
        type="text"
        id="exam"
        placeholder="JEE / NEET / CET"
      >

    </div>


    <!-- SCORE -->
    <div class="input-group">

      <label for="score">Score</label>

      <input
        type="text"
        id="score"
        placeholder="Enter score"
      >

    </div>


    <!-- PASSWORD -->
    <div class="input-group">

      <label for="password">
        Password
      </label>

      <input
        type="password"
        id="password"
        placeholder="Create password"
        autocomplete="new-password"
      >

    </div>


    <!-- CONFIRM PASSWORD -->
    <div class="input-group">

      <label for="confirmPassword">
        Confirm Password
      </label>

      <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm password"
        autocomplete="new-password"
      >

    </div>


    <!-- CREATE ACCOUNT -->
    <button
      class="loginBtn"
      onclick="registerUser()"
    >
      Create Account
    </button>


    <!-- MESSAGE -->
    <p id="msg"></p>


    <!-- LOGIN LINK -->
    <p style="margin-top:15px;">

      Already have an account?

      <a
        href="login.html"
        style="color:#007bff;font-weight:bold;"
      >
        Login
      </a>

    </p>

  </div>

</section>



<script>

/* =====================================================
   REGISTER USER
===================================================== */

function registerUser() {

  const name =
    document.getElementById("name").value.trim();

  const father =
    document.getElementById("father").value.trim();

  const email =
    document
      .getElementById("email")
      .value
      .trim()
      .toLowerCase();

  const mobile =
    document.getElementById("mobile").value.trim();

  const address =
    document.getElementById("address").value.trim();

  const course =
    document.getElementById("course").value;

  const tenth =
    document.getElementById("tenth").value.trim();

  const twelfth =
    document.getElementById("twelfth").value.trim();

  const exam =
    document.getElementById("exam").value.trim();

  const score =
    document.getElementById("score").value.trim();

  const password =
    document.getElementById("password").value;

  const confirmPassword =
    document.getElementById("confirmPassword").value;

  const msg =
    document.getElementById("msg");

  const emailError =
    document.getElementById("emailError");


  /* CLEAR MESSAGES */

  msg.innerHTML = "";
  emailError.innerHTML = "";


  /* =================================================
     REQUIRED FIELDS
  ================================================= */

  if (
    name === "" ||
    email === "" ||
    password === ""
  ) {

    msg.innerHTML =
      "❌ Please fill all required fields.";

    msg.style.color = "red";

    return;
  }


  /* =================================================
     EMAIL CHECK
  ================================================= */

  const emailPattern =
    /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

  if (!emailPattern.test(email)) {

    emailError.innerHTML =
      "❌ Please enter a valid email.";

    emailError.style.color = "red";

    return;
  }


  /* =================================================
     PASSWORD LENGTH
  ================================================= */

  if (password.length < 6) {

    msg.innerHTML =
      "❌ Password must be at least 6 characters.";

    msg.style.color = "red";

    return;
  }


  /* =================================================
     PASSWORD MATCH
  ================================================= */

  if (password !== confirmPassword) {

    msg.innerHTML =
      "❌ Passwords do not match.";

    msg.style.color = "red";

    return;
  }


  /* =================================================
     GET EXISTING USERS
  ================================================= */

  let users =
    JSON.parse(
      localStorage.getItem("users")
    ) || [];


  /* =================================================
     CHECK EMAIL ALREADY EXISTS
  ================================================= */

  const existingUser =
    users.find(
      user =>
        String(user.email)
          .trim()
          .toLowerCase() === email
    );


  if (existingUser) {

    emailError.innerHTML =
      "❌ This email is already registered.";

    emailError.style.color = "red";

    msg.innerHTML =
      "Please login with your existing account.";

    msg.style.color = "orange";

    return;
  }


  /* =================================================
     CREATE USERNAME
  ================================================= */

  const username =
    name
      .replace(/\s+/g, "")
      .toLowerCase() +
    Math.floor(1000 + Math.random() * 9000);


  /* =================================================
     CREATE USER
  ================================================= */

  const newUser = {

    username: username,

    name: name,

    father: father,

    email: email,

    mobile: mobile,

    address: address,

    course: course,

    tenth: tenth,

    twelfth: twelfth,

    exam: exam,

    score: score,

    password: password

  };


  /* =================================================
     SAVE USER
  ================================================= */

  users.push(newUser);

  localStorage.setItem(
    "users",
    JSON.stringify(users)
  );


  /* =================================================
     SUCCESS
  ================================================= */

  msg.innerHTML =
    "✅ Account created successfully!";

  msg.style.color = "green";


  /* =================================================
     GO TO LOGIN
  ================================================= */

  setTimeout(() => {

    window.location.href =
      "login.html";

  }, 1500);

}



/* =====================================================
   DARK MODE
===================================================== */

const darkBtn =
  document.getElementById("darkBtn");


if (
  localStorage.getItem("darkMode") === "on"
) {

  document.body.classList.add("dark");

}


darkBtn.addEventListener("click", () => {

  document.body.classList.toggle("dark");

  localStorage.setItem(
    "darkMode",
    document.body.classList.contains("dark")
      ? "on"
      : "off"
  );

});



/* =====================================================
   SIDEBAR
===================================================== */

const menuBtn =
  document.getElementById("menuBtn");

const sidebar =
  document.getElementById("sidebar");


menuBtn.addEventListener("click", () => {

  sidebar.classList.toggle("active");

});

</script>

</body>
</html>
