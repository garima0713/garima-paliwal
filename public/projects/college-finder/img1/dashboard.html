<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard | CollegeFinder India</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- NAVBAR -->

<nav>
  <div class="logo">CollegeFinder India</div>

  <div class="nav-buttons">
    <button onclick="window.location.href='index.html'">🏠 Home</button>
    <button onclick="window.location.href='profile.html'">👤 Profile</button>
    <button id="darkBtn">🌙 Dark Mode</button>
    <button onclick="logout()">🚪 Logout</button>
  </div>
</nav>

<!-- DASHBOARD -->

<section class="dashboard-section">

<div class="dashboard-header">
  <h1 id="welcomeText">Welcome 🎓</h1>
  <p>Manage your college journey from one place</p>
</div>

<div class="dashboard-grid">

<div class="dashboard-card"
onclick="window.location.href='profile.html'">
👤
<h3>My Profile</h3>
<p>View personal information</p>
</div>

<div class="dashboard-card"
onclick="window.location.href='colleges.html'">
🎓
<h3>Browse Colleges</h3>
<p>Explore top colleges</p>
</div>

<div class="dashboard-card"
onclick="window.location.href='favorites.html'">
❤️
<h3>Favorites</h3>
<p>Saved colleges</p>
</div>

<div class="dashboard-card"
onclick="window.location.href='compare.html'">
⚖️
<h3>Compare</h3>
<p>Compare colleges</p>
</div>

<div class="dashboard-card"
onclick="window.location.href='apply.html'">
📝
<h3>Apply Now</h3>
<p>Submit applications</p>
</div>

<div class="dashboard-card"
onclick="window.location.href='login.html'">
🚪
<h3>Logout</h3>
<p>Exit account</p>
</div>

</div>

</section>
<script>
    // LOGIN CHECK

if(localStorage.getItem("isLoggedIn")!=="true"){
  window.location.href="login.html";
}
const user =
JSON.parse(localStorage.getItem("user"));

if(user){

  document.getElementById("welcomeText").innerHTML =
  `Welcome, ${user.name} 🎓`;

}
// DARK MODE LOAD
if(localStorage.getItem("darkMode")==="on"){
  document.body.classList.add("dark");
}

const darkBtn = document.getElementById("darkBtn");

darkBtn.addEventListener("click",()=>{

  document.body.classList.toggle("dark");

  localStorage.setItem(
    "darkMode",
    document.body.classList.contains("dark") ? "on" : "off"
  );

});

// LOGOUT
function logout(){

  if(confirm("Are you sure you want to logout?")){

    localStorage.removeItem("isLoggedIn");

    window.location.href="login.html";

  }

}
</script>

</body>
</html>
